<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Бот для прокачек bib4ek</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e10;--panel:#18181b;--accent:#9147ff;--accent-soft:rgba(145,70,255,.06);--text:#efeff1;--muted:#adadb8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;padding:0;background:#0e0e10;color:var(--text);font-family:'Inter',sans-serif;font-weight:600}
#bgvid{position:fixed;top:0;left:0;width:100vw;height:100vh;object-fit:cover;z-index:0;opacity:.4;pointer-events:none}
.topbar{position:fixed;top:22px;left:22px;z-index:50;display:flex;gap:12px;align-items:flex-end}
.topbar-item{display:flex;flex-direction:column;gap:6px;background:rgba(22,38,29,.3);backdrop-filter:blur(10px);border:1px solid rgba(145,70,255,.2);border-radius:12px;padding:10px 14px;box-shadow:0 10px 34px rgba(0,0,0,.35)}
.topbar-item label{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
.topbar-item input{width:110px;padding:6px;border-radius:8px;background:rgba(0,0,0,.22);color:var(--text);font-size:14px;text-align:center;font-weight:700;outline:none;transition:.2s;border:1px solid rgba(145,70,255,.3)}
.topbar-item input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(145,70,255,.15)}
.topbar-count-row{display:flex;align-items:center;gap:6px}.pick-btn{width:26px;height:34px;border-radius:8px;background:transparent;color:var(--accent);font-weight:800;font-size:16px;cursor:pointer;transition:.2s;border:1px solid rgba(145,70,255,.3)}
.filters-panel{position:fixed;top:110px;left:22px;z-index:49;width:340px;display:flex;flex-direction:column;gap:8px;background:rgba(24,24,27,.55);backdrop-filter:blur(10px);border:1px solid rgba(145,70,255,.2);border-radius:12px;padding:12px;box-shadow:0 10px 34px rgba(0,0,0,.35)}
.filter-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.2);cursor:pointer;user-select:none}
.filter-row.base-row{cursor:default}
.filter-tag{min-width:56px;text-align:center;font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--accent);background:transparent;border:1px solid rgba(145,70,255,.3);border-radius:6px;padding:3px 6px}
.filter-desc{flex:1;color:#efeff1;font-size:10px;font-weight:600;line-height:1.35}
.filter-row input{display:none}
.switch{width:34px;height:18px;flex-shrink:0;border-radius:10px;background:rgba(239,239,241,.15);position:relative;transition:.2s;cursor:pointer}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#efeff1;transition:.2s}
.filter-row input:checked+.switch{background:var(--accent)}
.filter-row input:checked+.switch::after{left:18px;background:#0e0e10}
.winner-pick-btn{margin-top:4px;padding:12px;border-radius:10px;background:var(--accent);color:#0e0e10;font-weight:900;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.2s;border:none;box-shadow:0 0 20px rgba(145,70,255,.4)}
.winner-pick-btn:hover{background:#a970ff;box-shadow:0 0 30px rgba(145,70,255,.6)}
.winner-pick-btn:disabled{opacity:.5;cursor:not-allowed}
.last-winners{position:fixed;top:402px;bottom:22px;left:22px;z-index:49;width:340px;display:flex;flex-direction:column;gap:6px;background:rgba(24,24,27,.55);backdrop-filter:blur(10px);border:1px solid rgba(145,70,255,.2);border-radius:12px;padding:12px;box-shadow:0 10px 34px rgba(0,0,0,.35)}
.last-winners h4{margin:0;color:var(--accent);font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;text-align:center}
.last-winners-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;background:rgba(0,0,0,.2);border-radius:8px;padding:6px;max-height:none}
.last-winners-list::-webkit-scrollbar{width:5px}
.last-winners-list::-webkit-scrollbar-thumb{background:var(--accent);border-radius:8px}
.last-winners-list::-webkit-scrollbar-track{background:rgba(145,70,255,.08);border-radius:8px}
.lw-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;background:rgba(24,24,27,.6)}
.lw-item .nick{color:var(--accent);font-weight:800;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lw-item .date{color:#adadb8;font-size:10px;flex-shrink:0}
.lw-empty{color:#adadb8;font-size:10px;text-align:center;padding:8px}
.parts-count{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid rgba(145,70,255,.2);cursor:pointer;transition:.2s}
.parts-count:hover{border-color:var(--accent);background:rgba(145,70,255,.08)}
.pc-label{color:#adadb8;font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
.pc-num{color:var(--accent);font-size:26px;font-weight:900;text-shadow:0 0 15px rgba(145,70,255,.4);line-height:1.2}
.middle-hint{position:fixed;top:110px;bottom:22px;left:395px;right:calc(50vw + 24px);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;pointer-events:none;background:rgba(14,14,16,.82);backdrop-filter:blur(10px);border:2px solid rgba(145,70,255,.5);border-radius:16px;padding:26px 30px;box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 30px rgba(145,70,255,.2)}
.middle-hint::before{content:'';position:absolute;inset:0;border-radius:14px;padding:2px;background:linear-gradient(135deg,rgba(145,70,255,.6),transparent 50%,rgba(145,70,255,.25));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.middle-hint span.hint-main{font-size:18px;font-weight:800;color:#efeff1;line-height:1.5}
.middle-hint span.hint-code{font-size:20px;font-weight:800;color:#adadb8;letter-spacing:3px}
.pick-btn:hover{background:rgba(145,70,255,.15);border-color:var(--accent)}
#winnersPick{width:52px;padding:5px;border-radius:8px;background:rgba(0,0,0,.22);color:var(--accent);font-size:18px;font-weight:900;text-align:center;outline:none;transition:.2s;border:1px solid rgba(145,70,255,.3);-moz-appearance:textfield}
#winnersPick::-webkit-inner-spin-button,#winnersPick::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#winnersPick:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(145,70,255,.15)}
.topbar-count{min-width:44px;text-align:center;font-size:22px;font-weight:900;color:var(--text);text-shadow:0 0 12px rgba(145,70,255,.3);line-height:1.3}
.app{position:relative;z-index:1;display:flex;height:100vh;gap:18px;padding:0;align-items:flex-start;justify-content:flex-end}
.side{width:340px;min-height:170px;display:flex;flex-direction:column;gap:12px;background:rgba(22,38,29,.3);backdrop-filter:blur(10px);border:1px solid rgba(145,70,255,.2);border-radius:16px;padding:16px;box-shadow:0 10px 34px rgba(0,0,0,.35);overflow:visible}
.side label{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.side label::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.side input{width:100%;padding:4px;border-radius:6px;background:rgba(0,0,0,.22);color:var(--text);font-size:11px;text-align:center;font-weight:700;outline:none;transition:.2s}
.side input:focus{box-shadow:0 0 0 2px rgba(145,70,255,.1)}
.pbtn{width:100%;padding:10px;border-radius:10px;background:transparent;color:var(--accent);font-weight:800;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.2s;text-align:center;border:1px solid rgba(145,70,255,.3)}
.pbtn .num{display:block;font-size:42px;font-weight:900;line-height:1.15;letter-spacing:0}
.pbtn:hover{background:rgba(145,70,255,.15);border-color:var(--accent)}
.reset{width:100%;padding:9px;border-radius:10px;background:transparent;color:var(--accent);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.2s;border:1px solid rgba(145,70,255,.3)}
.reset:hover{background:rgba(145,70,255,.15);border-color:var(--accent)}
.frame-wrap{width:50vw;min-width:0;height:100vh;margin-left:auto;border-radius:16px;overflow:hidden;background:rgba(22,38,29,.25);backdrop-filter:blur(10px);box-shadow:0 10px 34px rgba(0,0,0,.35),0 0 0 2px rgba(145,70,255,.3),0 0 20px rgba(145,70,255,.15);border:2px solid rgba(145,70,255,.4);position:relative}
.leaderboard{width:280px;min-height:170px;display:flex;flex-direction:column;gap:8px;background:rgba(22,38,29,.3);backdrop-filter:blur(10px);border:1px solid rgba(145,70,255,.2);border-radius:16px;padding:16px;box-shadow:0 10px 34px rgba(0,0,0,.35)}
.leaderboard h3{margin:0 0 8px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;text-align:center}
.leaderboard-list{flex:1;overflow-y:auto;max-height:360px;display:flex;flex-direction:column;gap:4px}
.leaderboard-list::-webkit-scrollbar{width:5px}
.leaderboard-list::-webkit-scrollbar-thumb{background:var(--accent);border-radius:8px}
.leaderboard-list::-webkit-scrollbar-track{background:rgba(145,70,255,.08);border-radius:8px}
.lb-item{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.15)}
.lb-item .rank{font-weight:800;margin-right:8px;min-width:24px;text-align:center}
.lb-item .name{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-item .amount{font-weight:800;color:var(--accent)}
.lb-item.gold{background:linear-gradient(90deg,rgba(255,215,0,.15),transparent);border:1px solid rgba(255,215,0,.4)}
.lb-item.gold .rank{color:#ffd700;font-size:18px}
.lb-item.gold .name{color:#ffd700;font-size:16px;text-shadow:0 0 10px rgba(255,215,0,.5)}
.lb-item.gold .amount{color:#ffd700;font-size:16px;text-shadow:0 0 10px rgba(255,215,0,.5)}
.lb-item.silver{background:linear-gradient(90deg,rgba(192,192,192,.15),transparent);border:1px solid rgba(192,192,192,.4)}
.lb-item.silver .rank{color:#c0c0c0;font-size:16px}
.lb-item.silver .name{color:#c0c0c0;font-size:14px;text-shadow:0 0 8px rgba(192,192,192,.4)}
.lb-item.silver .amount{color:#c0c0c0;font-size:14px;text-shadow:0 0 8px rgba(192,192,192,.4)}
.lb-item.bronze{background:linear-gradient(90deg,rgba(205,127,50,.15),transparent);border:1px solid rgba(205,127,50,.4)}
.lb-item.bronze .rank{color:#cd7f32;font-size:14px}
.lb-item.bronze .name{color:#cd7f32;font-size:13px;text-shadow:0 0 6px rgba(205,127,50,.4)}
.lb-item.bronze .amount{color:#cd7f32;font-size:13px;text-shadow:0 0 6px rgba(205,127,50,.4)}
.lb-item.normal .rank{color:var(--muted);font-size:11px}
.lb-item.normal .name{color:var(--text);font-size:11px}
.lb-item.normal .amount{color:var(--muted);font-size:11px}
.password-modal{display:flex;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(8px)}
.password-box{width:340px;background:var(--panel);border:2px solid var(--accent);border-radius:20px;padding:30px;display:flex;flex-direction:column;gap:16px;box-shadow:0 0 60px rgba(145,70,255,.3)}
.password-box h2{margin:0;color:var(--accent);font-size:16px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;text-align:center}
.password-box input{padding:12px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid rgba(145,70,255,.3);color:var(--text);font-size:16px;text-align:center;outline:none;transition:.2s;letter-spacing:2px}
.password-box input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(145,70,255,.15)}
.password-box .pbtn{margin-top:4px}
.password-error{color:#f87171;font-size:12px;text-align:center;min-height:18px;font-weight:600}
.password-hint{color:var(--muted);font-size:10px;text-align:center;margin-top:-8px}
.frame-wrap::before{content:'';position:absolute;inset:0;border-radius:16px;padding:2px;background:linear-gradient(135deg,rgba(145,70,255,.5),transparent,rgba(145,70,255,.2));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
iframe{width:100%;height:100%;display:block;border:0;background:#0e0e10;opacity:0;pointer-events:none}
.chat-overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;overflow-y:scroll;font-size:13px;line-height:1.5;background:rgba(10,21,16,.5);z-index:5}
.chat-overlay::-webkit-scrollbar{width:6px}
.chat-overlay::-webkit-scrollbar-thumb{background:var(--accent);border-radius:8px}
.chat-overlay::-webkit-scrollbar-track{background:rgba(145,70,255,.08);border-radius:8px}
.chat-overlay::-webkit-scrollbar-thumb:hover{background:#bf94ff}
.chat-msg{padding:4px 8px;border-bottom:1px solid rgba(145,70,255,.05);word-wrap:break-word}
.chat-msg .nick{color:#fff;font-weight:700}
.chat-badge{width:16px;height:16px;margin-right:3px;vertical-align:middle;border-radius:3px}
.chat-badge-txt{display:inline-block;width:15px;height:15px;line-height:15px;margin-right:3px;vertical-align:middle;border-radius:3px;color:#fff;font-size:9px;font-weight:800;text-align:center}
.chat-msg.participant .nick{color:var(--accent);font-weight:800;text-shadow:0 0 8px rgba(145,70,255,.4)}
.chat-msg .time{color:var(--muted);font-size:10px;margin-right:6px}
.chat-msg .text{color:#efeff1}
.chat-msg.highlight{background:rgba(145,70,255,.08);border-left:3px solid var(--accent);border-radius:6px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);align-items:flex-start;justify-content:center;z-index:1000}
.modal.open{display:flex}
.tablebox{width:500px;max-width:92vw;max-height:80vh;background:var(--panel);border-radius:16px;padding:18px;box-shadow:0 14px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:12px}
.tablebox h3{margin:0;color:var(--accent);font-size:14px;letter-spacing:1.5px;text-transform:uppercase;text-align:center}
.search{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(145,70,255,.2);background:rgba(0,0,0,.2);color:var(--text);font-size:13px;outline:none;transition:.2s}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(145,70,255,.1)}
.code-row{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.15);border-radius:8px;padding:6px 10px}
.code-row label{color:var(--accent);font-size:11px;font-weight:700;text-transform:uppercase;white-space:nowrap}
.code-row input{flex:1;padding:4px;border:none;background:transparent;color:var(--text);font-size:14px;font-weight:800;text-align:center;outline:none}
.tb-list{flex:1;min-height:0;overflow-y:auto;background:rgba(0,0,0,.15);border-radius:10px;padding:8px}
.tb-list::-webkit-scrollbar{width:5px}.tb-list::-webkit-scrollbar-thumb{background:var(--accent);border-radius:8px}
.p{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-bottom:1px solid rgba(145,70,255,.05);font-size:13px}
.p b{color:var(--accent)}
.del{padding:3px 9px;border-radius:6px;border:none;background:rgba(239,68,68,.15);color:#f87171;font-weight:700;font-size:11px;cursor:pointer;transition:.2s}
.del:hover{background:#f87171;color:#fff}
.close{width:100%;padding:9px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.2s;border:none}
.close:hover{background:var(--accent);color:#0e0e10}
.timer-wrapper{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(145,70,255,.15)}
.timer-container{position:relative;width:140px;height:140px;display:flex;justify-content:center;align-items:center}
.timer-container svg{position:absolute;width:100%;height:100%;transform:rotate(-90deg)}
.timer-container circle{fill:none;stroke-width:8;stroke-linecap:round}
.circle-bg{stroke:rgba(145,70,255,.08)}
.circle-progress{stroke:url(#timerGradient);stroke-dasharray:352;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 6px rgba(145,70,255,.5))}
.time-display{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center}
.time-numbers{font-size:1.6rem;font-weight:900;letter-spacing:2px;color:var(--accent);text-shadow:0 0 20px rgba(145,70,255,.4)}
.time-label{font-size:0.55rem;text-transform:uppercase;letter-spacing:3px;color:var(--muted);margin-top:4px}
.time-label.finish{color:#f87171;text-shadow:0 0 10px rgba(239,68,68,.5)}
.timer-controls{display:flex;flex-direction:column;gap:8px;align-items:center}
.timer-row{display:flex;gap:8px}
.timer-btn{padding:8px 14px;border-radius:10px;background:transparent;color:var(--accent);font-weight:700;font-size:12px;cursor:pointer;transition:.25s;border:1px solid rgba(145,70,255,.3);min-width:40px;text-align:center;text-transform:uppercase;letter-spacing:.5px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.timer-btn:hover{background:rgba(145,70,255,.15);border-color:var(--accent);box-shadow:0 5px 20px rgba(145,70,255,.3);transform:translateY(-2px)}
.timer-btn:active{transform:translateY(0)}
.timer-btn.active{background:rgba(145,70,255,.2);color:var(--accent);border-color:var(--accent);box-shadow:0 0 15px rgba(145,70,255,.4)}
.timer-btn.start-btn{padding:10px 22px;font-size:11px;letter-spacing:1px}
.winner-btn{width:100%;padding:10px;border-radius:10px;background:transparent;color:var(--accent);font-weight:800;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.25s;border:1px solid rgba(145,70,255,.3);margin-top:4px}
.winner-btn:hover{background:rgba(145,70,255,.15);border-color:var(--accent);box-shadow:0 4px 15px rgba(145,70,255,.3)}
.winner-options{display:flex;flex-direction:column;gap:6px;margin-top:6px;max-height:0;overflow:hidden;transition:max-height .3s ease,opacity .3s ease;opacity:0}
.winner-options.show{max-height:200px;opacity:1;margin-top:8px}
.winner-opt{padding:10px;border-radius:8px;background:transparent;color:var(--accent);font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:.2s;border:1px solid rgba(145,70,255,.2);text-align:center}
.winner-opt:hover{background:rgba(145,70,255,.15);border-color:var(--accent)}
@media(max-width:900px){.app{flex-direction:column;height:auto}.side{width:90vw;max-width:540px}}

/* WHEEL STYLES */
.wheel-modal{display:none;position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.85);align-items:center;justify-content:center;backdrop-filter:blur(5px)}
.wheel-modal.show{display:flex}
.wheel-container{position:relative;display:flex;flex-direction:column;align-items:center}
.wheel-arrow{position:absolute;top:-25px;left:50%;transform:translateX(-50%);z-index:20;width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:40px solid #fff;filter:drop-shadow(0 0 10px rgba(255,255,255,.5))}
.wheel-nick-display{position:absolute;top:-70px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--accent),#bf94ff);color:#0e0e10;padding:8px 20px;border-radius:10px;font-size:18px;font-weight:900;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;box-shadow:0 0 20px rgba(145,70,255,.5);z-index:30;animation:nickPulse 1.5s ease-in-out infinite}
@keyframes nickPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.05)}}
#wheelCanvas{border-radius:50%;box-shadow:0 0 40px rgba(145,70,255,.3)}
.wheel-controls{width:280px;display:flex;flex-direction:column;gap:10px;margin-left:20px}
.wheel-controls h3{margin:0;color:var(--accent);font-size:14px;font-weight:900;letter-spacing:1px;text-transform:uppercase;text-align:center}
#elim-log{background:rgba(145,70,255,.1);border:1px solid rgba(145,70,255,.3);border-radius:8px;padding:10px;min-height:24px;font-size:14px;font-weight:bold;color:var(--accent);text-align:center}
.wheel-controls .btn{padding:10px;border-radius:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:.2s;border:1px solid rgba(145,70,255,.3);background:rgba(145,70,255,.08);color:var(--accent);text-align:center}
.wheel-controls .btn:hover{background:var(--accent);color:#0e0e10}

    <h3>УЧАСТНИКИ: <span id="cnt2">0</span></h3>
    <input class="search" id="search" placeholder="Поиск по нику..." oninput="renderModal()">

<script>
var CH='viix999';
var code=localStorage.getItem('bib4ek_code')||'+';
var parts=new Set(JSON.parse(localStorage.getItem('bib4ek_parts')||'[]'));
var sock=null;
var timerSeconds=0,timerInterval=null,timerRunning=false;
var MAX_DASH=2*Math.PI*56;
var passwordModal=document.getElementById('passwordModal');
var passwordInput=document.getElementById('passwordInput');
var passwordError=document.getElementById('passwordError');
var CORRECT_PASSWORD='a1a1';

// HOW MANY WINNERS TO PICK (used by future "choose winner" button)
var winnersToPick=parseInt(localStorage.getItem('bib4ek_winners_pick'))||1;
if(winnersToPick<1)winnersToPick=1;

function getWinnersPick(){
  var inp=document.getElementById('winnersPick');
  var v=parseInt(inp&&inp.value)||1;
  if(v<1)v=1;
  if(winnersToPick!==v){winnersToPick=v;localStorage.setItem('bib4ek_winners_pick',winnersToPick);}
  return winnersToPick;
}
function saveWinnersPick(){getWinnersPick();}
function adjustWinners(d){
  var inp=document.getElementById('winnersPick');
  var v=(parseInt(inp.value)||1)+d;
  if(v<1)v=1;
  if(v>parts.size&&parts.size>0)v=parts.size;
  inp.value=v;
  getWinnersPick();
}

// WINNER FILTERS (FM / NEW / NW / GLOBAL)
var filterState={ALL:false,FM:false,GLOBAL:false};

function loadFilters(){
  try{
    var saved=JSON.parse(localStorage.getItem('bib4ek_filters')||'{}');
    ['ALL','FM','GLOBAL'].forEach(function(k){
      filterState[k]=!!saved[k];
      var el=document.getElementById('f'+k);
      if(el)el.checked=filterState[k];
    });
  }catch(e){}
}
function saveFilters(){
  ['ALL','FM','GLOBAL'].forEach(function(k){
    var el=document.getElementById('f'+k);
    filterState[k]=el?!!el.checked:false;
  });
  try{localStorage.setItem('bib4ek_filters',JSON.stringify(filterState));}catch(e){}
  renderParticipantsCount();
  updateMiddleHint();
}

function userHasRealWin(name){
  var h=winnerHistory[name.toLowerCase()];
  if(!h||!h.length)return false;
  return h.some(function(x){return !x.isReroll&&(x.amount||0)>0;});
}
function userMsgCount(name){
  var m=userMessages[name];
  return m?m.length:0;
}

function filterCandidates(arr){
  return arr.filter(function(name){
    if(filterState.FM&&userMsgCount(name)>1)return false;
    if(filterState.GLOBAL&&userHasRealWin(name))return false;
    return true;
  });
}

function chooseWinners(){
  var n=getWinnersPick();
  var pool=filterCandidates(Array.from(parts));
  if(pool.length===0){
    alert('Нет подходящих участников под выбранные фильтры!');
    return;
  }
  if(n>pool.length)n=pool.length;
  var picked=[];
  var copy=pool.slice();
  for(var i=0;i<n&&copy.length>0;i++){
    var idx=Math.floor(Math.random()*copy.length);
    picked.push(copy.splice(idx,1)[0]);
  }
  showWinner(picked[0]);
  if(picked.length>1){
    alert('Выбранные победители:\n'+picked.join('\n')+'\n\nНа экране отображается: '+picked[0]);
  }
}



function checkPassword(){
  var val=passwordInput.value.trim();
  if(val===CORRECT_PASSWORD){
    passwordModal.style.display='none';
    document.body.style.overflow='';
  }else{
    passwordError.textContent='Неверный пароль!';
    passwordInput.value='';
    passwordInput.focus();
  }
}

passwordInput.addEventListener('keydown',function(e){
  if(e.key==='Enter')checkPassword();
});

// Prevent access without password
document.body.style.overflow='hidden';
var winnerMenuOpen=false;

// WHEEL VARIABLES
var wheelParticipants=[];
var isWheelSpinning=false;
var currentRotation=0;
var selectedSpinMode='elimination';
var currentWinner=null;
var winnerResponded=false;
var winnerMessages=[];
var statistics=JSON.parse(localStorage.getItem('bib4ek_stats')||'[]');
var currentSession=null;
var wheelColors=['#2a1a4a','#3d2466','#503080','#634099','#4a2a7a','#5c33a3','#6f3dcc','#8252f2','#9147ff','#772ce8'];

document.getElementById('code').value=code;
document.getElementById('winnersPick').value=winnersToPick;
loadFilters();
updateMiddleHint();

function saveCode(){code=document.getElementById('code').value.trim()||'+';localStorage.setItem('bib4ek_code',code);updateMiddleHint();}
function resetParts(){parts.clear();render();renderModal();}
function openModal(){renderModal();document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function removePart(n){parts.delete(n);render();renderModal();}
function renderModal(){var q=document.getElementById('search').value.trim().toLowerCase();var base=filterCandidates(Array.from(parts));var arr=base.filter(function(p){return !q||p.toLowerCase().indexOf(q)>=0});var l=document.getElementById('tb-list');l.innerHTML=arr.map(function(p){return'<div class="p"><span>'+esc(p)+'</span><button class="del" data-n="'+esc(p)+'">✕</button></div>';}).join('')||'<div style="color:var(--muted);text-align:center;padding:20px">Пока пусто</div>';document.getElementById('cnt2').textContent=arr.length;}
function renderParticipantsCount(){var el=document.getElementById('partsCount');if(el)el.textContent=filterCandidates(Array.from(parts)).length;}

function updateMiddleHint(){
  var h=document.getElementById('middleHint');
  if(!h)return;
  if(filterState.ALL){
    h.innerHTML='<span class="hint-main">Напиши любое сообщение в чат<br>для участия в прокачке</span>';
  }else{
    var code=document.getElementById('code').value.trim()||'+';
    h.innerHTML='<span class="hint-code">'+esc(code)+'</span><span class="hint-main">в чат для участия в прокачке</span>';
  }
}
document.getElementById('tb-list').onclick=function(e){if(e.target&&e.target.classList.contains('del'))removePart(e.target.getAttribute('data-n'));};
function render(){var c=document.getElementById('cnt');if(c)c.textContent=parts.size;renderParticipantsCount();localStorage.setItem('bib4ek_parts',JSON.stringify(Array.from(parts)));}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// LAST WINNERS LIST (under "choose winner" button)
function renderLastWinners(){
  var list=document.getElementById('lastWinnersList');
  if(!list)return;
  var rows=[];
  Object.keys(winnerHistory).forEach(function(key){
    (winnerHistory[key]||[]).forEach(function(h){
      if(h.isReroll)return;
      rows.push({name:key,date:h.date||'---'});
    });
  });
  rows.reverse();
  if(rows.length===0){
    list.innerHTML='<div class="lw-empty">Побед ещё нет</div>';
    return;
  }
  list.innerHTML=rows.slice(0,50).map(function(r){
    return'<div class="lw-item"><span class="nick">'+esc(r.name)+'</span><span class="date">'+esc(r.date)+'</span></div>';
  }).join('');

// LEADERBOARD RENDERER
function renderLeaderboard(){
  var list=document.getElementById('leaderboardList');
  if(!list)return;
  
  // Calculate total withdrawals per user
  var totals={};
  Object.keys(winnerHistory).forEach(function(key){
    var total=0;
    (winnerHistory[key]||[]).forEach(function(h){
      if(!h.isReroll)total+=(h.amount||0);
    });
    if(total>0)totals[key]=total;
  });
  
  // Sort by amount descending
  var sorted=Object.keys(totals).map(function(name){
    return{name:name,total:totals[name]};
  }).sort(function(a,b){return b.total-a.total});
  
  if(sorted.length===0){
    list.innerHTML='<div style="color:var(--muted);text-align:center;padding:20px;font-size:11px">Нет данных</div>';
    return;
  }
  
  // Render items
  list.innerHTML=sorted.map(function(item,i){
    var cls='lb-item ';
    var rankSymbol='';
    if(i===0){cls+='gold';rankSymbol='🥇';}
    else if(i===1){cls+='silver';rankSymbol='🥈';}
    else if(i===2){cls+='bronze';rankSymbol='🥉';}
    else {cls+='normal';rankSymbol=(i+1)+'.';}
    
    return'<div class="'+cls+'">'+
      '<span class="rank">'+rankSymbol+'</span>'+
      '<span class="name">'+esc(item.name)+'</span>'+
      '<span class="amount">'+item.total.toLocaleString()+' ₽</span>'+
      '</div>';
  }).join('');
}

function getParticipantUnderArrow(angle){if(wheelParticipants.length===0)return'---';var slice=(Math.PI*2)/wheelParticipants.length;var idx=Math.floor((-Math.PI/2-angle)/slice);idx=((idx%wheelParticipants.length)+wheelParticipants.length)%wheelParticipants.length;return wheelParticipants[idx];}

function drawWheel(angle){var canvas=document.getElementById('wheelCanvas');var ctx=canvas.getContext('2d');var cw=canvas.width,ch=canvas.height;var cx=cw/2,cy=ch/2;var r=Math.min(cw,ch)/2-15;ctx.clearRect(0,0,cw,ch);var nickDisplay=document.getElementById('wheelNick');if(nickDisplay)nickDisplay.textContent=getParticipantUnderArrow(angle);if(wheelParticipants.length===0)return;var slice=(Math.PI*2)/wheelParticipants.length;wheelParticipants.forEach(function(name,i){ctx.beginPath();ctx.fillStyle=wheelColors[i%wheelColors.length];ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,angle+i*slice,angle+(i+1)*slice);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1.5;ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(angle+i*slice+slice/2);var textR=r*0.55;var maxW=slice*textR*0.85;var maxFont=wheelParticipants.length<=5?18:wheelParticipants.length<=10?14:wheelParticipants.length<=20?11:9;var minFont=7;var displayName=String(name);var chosenFont=maxFont;for(var fs=maxFont;fs>=minFont;fs--){ctx.font='bold '+fs+'px Arial';if(ctx.measureText(displayName).width<=maxW){chosenFont=fs;break;}}ctx.font='bold '+minFont+'px Arial';if(ctx.measureText(displayName).width>maxW){var txt=displayName;while(txt.length>1){txt=txt.slice(0,-1);if(ctx.measureText(txt+'…').width<=maxW){displayName=txt+'…';break;}}}ctx.fillStyle='#fff';ctx.font='bold '+chosenFont+'px Arial';ctx.shadowBlur=4;ctx.shadowColor='rgba(0,0,0,.8)';ctx.textBaseline='middle';ctx.fillText(displayName,textR,0);ctx.restore();});ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='var(--accent)';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,10,0,Math.PI*2);ctx.fillStyle='var(--accent)';ctx.fill();ctx.shadowBlur=0;}

/* ====== ИСПРАВЛЕННАЯ ФУНКЦИЯ ======
   Раньше здесь отсутствовал начальный вызов requestAnimationFrame(animate)
   после определения функции animate, а лишний вызов стоял внутри самой
   animate вне блока if(progress<1) — из-за этого анимация либо не
   запускалась вовсе, либо зацикливалась после завершения.
   Также не хватало закрывающей скобки функции startSpin. */
function startSpin(mode){
  var duration=(parseInt(document.getElementById('durInput').value)||5)*1000;
  var n=wheelParticipants.length;
  if(n===0)return;
  isWheelSpinning=true;
  var slice=(Math.PI*2)/n;
  var winner=getRandomParticipant();
  var winnerIdx=wheelParticipants.indexOf(winner);
  if(winnerIdx===-1)winnerIdx=Math.floor(Math.random()*n);
  winner=wheelParticipants[winnerIdx];
  var fullSpins=Math.PI*2*(6+Math.floor(Math.random()*4));
  var jitter=(Math.random()-.5)*slice*.3;
  var endAngle=-Math.PI/2-(winnerIdx*slice+slice/2)-fullSpins+jitter;
  var startAngle=0;
  var startTimestamp=null;

  function animate(ts){
    if(!startTimestamp)startTimestamp=ts;
    var progress=Math.min((ts-startTimestamp)/duration,1);
    var ease=1-Math.pow(1-progress,4);
    var currentAngle=startAngle+(endAngle-startAngle)*ease;
    drawWheel(currentAngle);
    if(progress<1){
      requestAnimationFrame(animate);
    }else{
      drawWheel(endAngle);
      isWheelSpinning=false;
      if(mode==='normal'){
        showWinner(winner);
        document.getElementById('spinBtn').disabled=false;
      }else{
        document.getElementById('elim-log').innerText='❌ ВЫБЫЛ: '+winner;
        wheelParticipants.splice(winnerIdx,1);
        if(wheelParticipants.length===0){
          document.getElementById('spinBtn').disabled=false;
        }else if(wheelParticipants.length===1){
          setTimeout(function(){
            drawWheel(0);
            showWinner(wheelParticipants[0]);
            document.getElementById('spinBtn').disabled=false;
          },1500);
        }else{
          setTimeout(function(){
            drawWheel(0);
            document.getElementById('spinBtn').disabled=false;
          },1000);
        }
      }
    }
  }

  requestAnimationFrame(animate);
}

function getRandomParticipant(){return wheelParticipants[Math.floor(Math.random()*wheelParticipants.length)];}

function chatStatus(txt,cls){console.log('[CHAT]',txt);}

function connect(){
  if(sock)try{sock.close()}catch(e){}
  chatStatus('ПОДКЛЮЧЕНИЕ...');
  sock=new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  sock.onopen=function(){
    chatStatus('СОКЕТ ОТКРЫТ, АВТОРИЗАЦИЯ...');
    sock.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    sock.send('PASS SCHMOOPIIE');
    sock.send('NICK justinfan12345');
  };
  sock.onmessage=function(ev){
    var d=ev.data;
    // PING
    if(d.indexOf('PING')===0){sock.send('PONG :tmi.twitch.tv');return;}

    // 001 — регистрация прошла, только теперь можно JOIN (иначе Twitch отклоняет JOIN)
    if(d.indexOf(' 001 ')>=0){
      chatStatus('АВТОРИЗОВАН, ЗАХОЖУ В #'+CH.toLowerCase(),'ok');
      sock.send('JOIN #'+CH.toLowerCase());
      return;
    }

    // NOTICE — ошибка от Twitch (логин/канал и т.п.)
    if(d.indexOf(' NOTICE ')>=0){
      chatStatus('NOTICE: '+d.split(' NOTICE ')[1],'err');
      return;
    }

    // RECONNECT — сервер просит переподключиться
    if(d.indexOf(' RECONNECT ')>=0){try{sock.close()}catch(e){}return;}

    // JOIN подтверждён
    if(d.indexOf(' JOIN #')>=0&&d.indexOf('justinfan')>=0){
      chatStatus('В ЧАТЕ #'+CH.toLowerCase()+' ✓','ok');
      return;
    }

    // Parse Twitch IRC tags
    var tags={};
    if(d.charAt(0)==='@'){
      var spaceIdx=d.indexOf(' ');
      if(spaceIdx>0){
        var tagsStr=d.substring(1,spaceIdx);
        tagsStr.split(';').forEach(function(tag){
          var eq=tag.indexOf('=');
          if(eq>=0)tags[tag.substring(0,eq)]=tag.substring(eq+1);
        });
      }
    }

    // CLEARMSG — удаление конкретного сообщения модератором
    var clearMsgMatch=d.indexOf(' CLEARMSG #'+CH+' :');
    if(clearMsgMatch>=0){
      var targetMsgId=tags['target-msg-id'];
      var login=tags['login']||'';
      if(targetMsgId){
        chatMessages=chatMessages.filter(function(m){return m.id!==targetMsgId;});
        renderChatOverlay();
        // Удалить также из userMessages
        if(login&&userMessages[login]){
          userMessages[login]=userMessages[login].filter(function(m){return m.id!==targetMsgId;});
        }
      }
      return;
    }

    // CLEARCHAT — бан/тайм-аут пользователя (удаление всех его сообщений)
    var clearChatMatch=d.indexOf(' CLEARCHAT #'+CH+' :');
    if(clearChatMatch>=0){
      var targetUser=d.split(' CLEARCHAT #'+CH+' :')[1];
      if(targetUser){
        targetUser=targetUser.trim().toLowerCase();
        chatMessages=chatMessages.filter(function(m){return m.user.toLowerCase()!==targetUser;});
        renderChatOverlay();
        // Удалить из userMessages
        Object.keys(userMessages).forEach(function(k){
          if(k.toLowerCase()===targetUser)delete userMessages[k];
        });
      }
      return;
    }

    // PRIVMSG — обычное сообщение
    var mk='PRIVMSG #'+CH+' :';
    if(d.indexOf(mk)<0)return;
    var user,msg;
    if(tags['display-name'])user=tags['display-name'];
    else if(d.charAt(0)==='@'){var p=d.split(' ');user=p[1].split('!')[0].substring(1);}
    else{user=d.split('!')[0].substring(1);}
    msg=d.split(mk)[1].trim();

    if(filterState.ALL&&!parts.has(user)){parts.add(user);render();}
    if(msg.trim().toLowerCase()===code.toLowerCase()&&!parts.has(user)){parts.add(user);render();}

    var time=new Date().toLocaleTimeString();
    var msgId=tags['id']||null;
    renderChatMessage(user,msg,time,msgId,tags['badges'],tags['color']);

    if(!userMessages[user])userMessages[user]=[];
    userMessages[user].push({time:time,text:msg,id:msgId});

    if(currentWinner&&user.toLowerCase()===currentWinner.toLowerCase()){
      if(winTimerActive){
        winTimerActive=false;
        var timerLabel=document.getElementById('win-timer-label');
        var nick=document.getElementById('win-nick');
        timerLabel.classList.add('timer-responded');
        nick.classList.add('winner-responded');
      }
      var winnerScreen=document.getElementById('winner-screen');
      if(winnerScreen&&winnerScreen.classList.contains('open')){
        var history=document.getElementById('win-chat-history');
        if(history){
          var newMsg=document.createElement('div');
          newMsg.className='win-response-msg';
          newMsg.innerHTML='<small style="color:var(--muted);">'+time+'</small> '+esc(msg);
          history.insertBefore(newMsg,history.firstChild);
          history.scrollTop=0;
        }
      }
      winnerResponded=true;
      if(currentSession)currentSession.endTime=Date.now();
    }
    winnerMessages.push({user:user,msg:msg,isWinner:currentWinner&&user.toLowerCase()===currentWinner.toLowerCase()});
  };
  sock.onclose=function(){chatStatus('ОТКЛЮЧЕН, ПЕРЕПОДКЛЮЧЕНИЕ ЧЕРЕЗ 3с','err');setTimeout(connect,3000);};
  sock.onerror=function(){chatStatus('ОШИБКА СОКЕТА','err');};
}
